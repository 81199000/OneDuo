<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>一键装</title>
<style>
  :root {
    --bg: #111214; --card: #1c1d21; --card-hi: #26272c; --line: #2c2d33;
    --text: #f2f2f3; --sub: #a0a1a8; --dim: #6c6d74; --accent: #ff3b30; --ok: #34c759;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei UI", "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; }
  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; padding: 22px 24px 16px; gap: 16px; }
  header { display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  header p { color: var(--sub); font-size: 14px; }
  header .upd { margin-left: auto; color: var(--accent); font-size: 13px; cursor: pointer; display: none; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 18px; min-height: 0; }
  .list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .list .src { color: var(--dim); font-size: 12px; margin-bottom: 2px; }
  .item { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 14px; background: var(--card);
    cursor: pointer; transition: background .12s; }
  .item:hover { background: #222328; }
  .item.on { background: var(--card-hi); box-shadow: inset 0 0 0 1px #3a3b42; }
  .icon { width: 56px; height: 56px; border-radius: 13px; flex: none; object-fit: cover; background: #2a2b30; }
  .icon.big { width: 76px; height: 76px; border-radius: 17px; }
  .item h3 { font-size: 16px; font-weight: 600; }
  .item .s { color: var(--sub); font-size: 12.5px; }
  .item .v { color: var(--dim); font-size: 12px; }
  .addbtn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px; border-radius: 14px;
    border: 1.5px dashed #3a3b42; color: var(--sub); cursor: pointer; font-size: 14px; transition: all .12s; flex: none; }
  .addbtn:hover { border-color: var(--accent); color: var(--text); }
  .group { color: var(--dim); font-size: 12px; margin: 8px 0 0; }
  .tag { display: inline-block; font-size: 11px; color: var(--sub); border: 1px solid #3a3b42; border-radius: 6px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
  .ghostbtn { background: transparent; color: var(--sub); border: 1px solid #3a3b42; border-radius: 12px; font: inherit; font-size: 14px;
    padding: 11px 18px; cursor: pointer; margin-right: auto; }
  .ghostbtn:hover { color: var(--accent); border-color: var(--accent); }
  .drop { position: fixed; inset: 0; background: rgba(17,18,20,.88); display: none; align-items: center; justify-content: center;
    border: 3px dashed var(--accent); border-radius: 18px; margin: 10px; font-size: 22px; font-weight: 700; color: var(--text); z-index: 10; }
  .drop.show { display: flex; }
  .icon.ph { display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: var(--sub); }
  .toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #2a2b30; color: var(--text); padding: 10px 18px;
    border-radius: 12px; font-size: 13px; white-space: pre-line; display: none; z-index: 20; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .tabs { display: flex; gap: 6px; margin-left: 18px; }
  .tabs span { padding: 5px 14px; border-radius: 9px; color: var(--sub); cursor: pointer; font-size: 14px; }
  .tabs span.on { background: var(--card-hi); color: var(--text); }
  .tabs .badge { background: var(--accent); color: #fff; border-radius: 9px; font-size: 11px; padding: 0 6px; margin-left: 5px; }
  .pilotbar { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 14px 18px; margin-bottom: 12px; }
  .pilotbar .t { flex: 1; } .pilotbar h3 { font-size: 15px; } .pilotbar p { color: var(--sub); font-size: 12.5px; }
  .sw { width: 44px; height: 26px; border-radius: 13px; background: #3a3b40; position: relative; cursor: pointer; flex: none; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
  .sw.on { background: var(--ok); } .sw.on::after { left: 21px; }
  .sw.sm { width: 36px; height: 21px; } .sw.sm::after { width: 15px; height: 15px; } .sw.sm.on::after { left: 18px; }
  .inst { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; background: var(--card); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; }
  .inst h4 { font-size: 14.5px; font-weight: 600; } .inst .m { color: var(--sub); font-size: 12px; }
  .days { font-size: 13px; font-weight: 600; text-align: right; min-width: 92px; }
  .days.ok { color: var(--ok); } .days.warn { color: #ff9f0a; } .days.bad { color: var(--accent); }
  .inst .err { color: var(--accent); font-size: 12px; grid-column: 1 / -1; margin-top: -4px; }
  .pilotmsg { font-size: 12.5px; color: var(--sub); }
  .pilotmsg.run { color: #ff9f0a; } .pilotmsg.ok { color: var(--ok); } .pilotmsg.err { color: var(--accent); }
  .smallbtn { background: transparent; border: 1px solid #3a3b42; color: var(--sub); border-radius: 9px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .smallbtn:hover { color: var(--text); border-color: var(--sub); }
  .detail { background: var(--card); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; min-height: 0; }
  .empty { margin: auto; color: var(--sub); font-size: 16px; }
  .head { display: flex; gap: 16px; align-items: center; }
  .head h2 { font-size: 24px; font-weight: 700; }
  .meta { color: var(--sub); font-size: 13px; }
  .link { color: var(--accent); font-size: 13px; cursor: pointer; }
  .desc { color: var(--sub); margin: 16px 0 6px; font-size: 14px; }
  .steps { list-style: none; margin-top: 12px; display: flex; flex-direction: column; gap: 9px; }
  .steps li { display: flex; align-items: center; gap: 10px; color: var(--sub); }
  .steps li.on, .steps li.ok, .steps li.err { color: var(--text); }
  .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--dim); flex: none; position: relative; }
  .ok .dot { background: var(--ok); border-color: var(--ok); }
  .on .dot { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
  .err .dot { border-color: var(--accent); background: var(--accent); }
  .err .dot::after { content: "✕"; position: absolute; inset: -3px 0 0 0; text-align: center; font-size: 11px; color: #fff; font-weight: 700; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note { color: var(--dim); font-size: 12.5px; }
  .bar { height: 4px; background: #2a2b30; border-radius: 2px; overflow: hidden; margin: 14px 0 0; display: none; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .msg { margin-top: 14px; font-size: 13.5px; white-space: pre-line; min-height: 22px; color: var(--sub); }
  .msg.err { color: var(--accent); } .msg.ok { color: var(--ok); }
  .actions { margin-top: auto; display: flex; justify-content: flex-end; padding-top: 16px; }
  button.go { background: var(--accent); color: #fff; border: 0; border-radius: 12px; font-size: 16px; font-weight: 700;
    padding: 12px 34px; cursor: pointer; font-family: inherit; }
  button.go:disabled { background: #3a3b40; color: #8a8b92; cursor: default; }
  footer { display: flex; align-items: center; gap: 10px; color: var(--sub); font-size: 13px; }
  footer .d { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); }
  footer .d.on { background: var(--ok); }
  footer select { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 8px; font: inherit; font-size: 13px; }
  footer .acct { margin-left: auto; color: var(--dim); font-size: 12px; }
  /* 弹窗 */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; }
  .mask.show { display: flex; }
  .dialog { width: 440px; max-height: 92vh; overflow-y: auto; background: var(--card); border-radius: 16px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .dialog h3 { font-size: 18px; margin-bottom: 6px; }
  .dialog p { color: var(--sub); font-size: 13px; margin-bottom: 14px; }
  .safe { background: #141518; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 4px 0 6px; }
  .safe-h { font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
  .safe ul { margin: 0 0 0 16px; color: var(--sub); font-size: 12.5px; line-height: 1.6; }
  .safe b { color: var(--text); font-weight: 600; }
  .safe-note { color: var(--dim); font-size: 11.5px; margin-top: 8px; line-height: 1.5; }
  .dialog label { display: block; color: var(--sub); font-size: 12.5px; margin: 10px 0 4px; }
  .dialog input { width: 100%; background: #111214; color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font: inherit; font-size: 15px; -webkit-user-select: text; user-select: text; }
  .dialog input.code { letter-spacing: 8px; text-align: center; font-size: 22px; }
  .dialog .row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .dialog button { border: 0; border-radius: 10px; padding: 9px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  .dialog .ghost { background: transparent; color: var(--sub); }
  .dialog .primary { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>一键装</h1>
    <div class="tabs"><span id="tab-apps" class="on" onclick="showTab('apps')">装 App</span><span id="tab-mine" onclick="showTab('mine')">我的手机<span class="badge" id="minebadge" style="display:none"></span></span></div>
    <p id="slogan" style="margin-left:6px">用自己的 Apple ID 免费签名，直接装到 iPhone / iPad</p>
    <span class="upd" id="upd"></span>
  </header>
  <main id="mineview" style="display:none;grid-template-columns:1fr;overflow-y:auto"></main>
  <main id="appsview">
    <div class="list" id="list"><div class="src">正在读取应用列表…</div></div>
    <div class="detail" id="detail"><div class="empty">← 选一个 App</div></div>
  </main>
  <footer>
    <span class="d" id="devdot"></span>
    <span id="devtext">未连接手机：用数据线把 iPhone 连到这台电脑，解锁后点「信任」</span>
    <select id="devsel" style="display:none"></select>
    <span class="acct" id="acct"></span>
  </footer>
</div>

<div class="drop" id="drop">松手添加 IPA</div>
<div class="toast" id="toast"></div>

<div class="mask" id="loginMask"><div class="dialog">
  <h3>登录 Apple ID</h3>
  <div class="safe">
    <div class="safe-h">🔒 账号密码只发给苹果官方，不经过我们，也不保存密码。</div>
    <div class="safe-note">建议用 Apple ID 小号：免费签名会在账号里生成证书，用小号不影响主号。</div>
  </div>
  <label>Apple ID（邮箱或手机号）</label><input id="user" autocomplete="off" spellcheck="false">
  <label>密码</label><input id="pw" type="password">
  <div class="row"><button class="ghost" onclick="loginDone(false)">取消</button>
    <button class="primary" onclick="loginDone(true)">登录</button></div>
</div></div>

<div class="mask" id="codeMask"><div class="dialog">
  <h3>双重认证验证码</h3>
  <p id="codeTip">Apple 已向你的手机发送了 6 位验证码</p>
  <input id="code" class="code" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
  <div class="row"><button class="ghost" onclick="codeDone(false)">取消</button>
    <button class="primary" onclick="codeDone(true)">确定</button></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const S = { installs: [], pilotOn: true, pilotMsg: null, tab: "apps", apps: [], custom: [], sel: null, devices: [], dev: null, busy: false };
const allApps = () => S.apps.concat(S.custom);
const iconHTML = (a, big) => a.icon ? `<img class="icon${big ? " big" : ""}" src="${a.icon}" alt="">`
  : `<div class="icon ph${big ? " big" : ""}">${esc((a.name || "?").slice(0, 1))}</div>`;
function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 4000); }
const STEPS = [["device","连接手机"],["account","登录 Apple ID"],["download","准备安装包"],["install","签名并安装"],["trust","在手机上信任"]];
const api = () => window.pywebview.api;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

window.onEvent = (ev, d) => {
  if (ev === "catalog") renderList(d);
  else if (ev === "custom") { S.custom = d.apps; if (d.select) { S.sel = d.select; } if (S.sel && !allApps().find(a => a.id === S.sel)) S.sel = null; renderList(); if (!S.busy) { S.sel ? renderDetail() : ($("detail").innerHTML = '<div class="empty">← 选一个 App</div>'); } if (d.select) toast("已添加，点「一键安装」签名装到手机"); }
  else if (ev === "toast") toast(d);
  else if (ev === "refreshed") { S.refreshing = false; renderList(); toast(d); }
  else if (ev === "installs") { S.installs = d.items; S.pilotOn = d.enabled; renderMine(); }
  else if (ev === "pilot") { S.pilotMsg = d; renderMine(); if (d.state !== "run") toast(d.text); }
  else if (ev === "catalog_error") $("list").innerHTML = `<div class="src" style="color:var(--accent)">应用列表加载失败：${esc(d)}</div>`;
  else if (ev === "app_version") { Object.assign(S.apps.find(a => a.id === d.id) || {}, d); renderList(); if (S.sel === d.id && !S.busy) renderDetail(); }
  else if (ev === "step") setStep(d.step, d.state, d.note);
  else if (ev === "progress") { const b = document.querySelector(".bar"); if (b) { b.style.display = "block"; b.firstChild.style.width = (d.value*100).toFixed(0)+"%"; } }
  else if (ev === "log") msg(d);
  else if (ev === "need_login") { $("loginMask").classList.add("show"); setTimeout(() => $("user").focus(), 50); }
  else if (ev === "need_2fa") { $("codeTip").textContent = d === "sms" ? "Apple 已通过短信发送 6 位验证码" : "Apple 已向你登录这个 Apple ID 的设备发送了 6 位验证码"; $("code").value = ""; $("codeMask").classList.add("show"); setTimeout(() => $("code").focus(), 50); }
  else if (ev === "done") finish(true);
  else if (ev === "error") finish(false, d);
  else if (ev === "self_update") { const u = $("upd"); u.textContent = `有新版本 v${d.version} ↗`; u.style.display = "block"; u.onclick = () => api().open_url(d.url); }
};

function renderList(d) {
  if (d) { S.apps = d.apps; S.source = d.source; }
  const card = a => `
    <div class="item ${a.id === S.sel ? "on" : ""}" onclick="select('${a.id}')">
      ${iconHTML(a)}
      <div style="min-width:0"><h3>${esc(a.name)}</h3><div class="s">${esc(a.subtitle)}</div>
      <div class="v">${a.custom ? "v" + esc(a.version) + " · " + (a.size / 1048576).toFixed(1) + " MB"
        : a.version ? "最新 v" + esc(a.version) : (a.has_asset === false ? "暂无安装包" : "读取版本…")}</div></div>
    </div>`;
  $("list").innerHTML = `<div class="src" style="display:flex;align-items:center">共 ${S.apps.length} 个 App · 列表来自 ${esc(S.source || "…")}<span class="link" id="refbtn" style="margin-left:auto" onclick="doRefresh()">${S.refreshing ? "刷新中…" : "⟳ 刷新"}</span></div>`
    + S.apps.map(card).join("")
    + (S.custom.length ? `<div class="group">我添加的 IPA</div>` + S.custom.map(card).join("") : "")
    + `<div class="addbtn" onclick="api().pick_ipa()">＋ 添加自己的 IPA<span style="color:var(--dim);font-size:12px">（也可拖进窗口）</span></div>`;
}

function doRefresh() {
  if (S.refreshing) return;
  S.refreshing = true; renderList(); api().refresh();
}

function showTab(t) {
  S.tab = t;
  $("tab-apps").className = t === "apps" ? "on" : ""; $("tab-mine").className = t === "mine" ? "on" : "";
  $("appsview").style.display = t === "apps" ? "grid" : "none";
  $("mineview").style.display = t === "mine" ? "block" : "none";
  $("slogan").style.display = t === "apps" ? "" : "none";
  renderMine();
}

function fmtDays(x) {
  if (x <= 0) return ["已过期", "bad"];
  if (x < 1) return [`剩 ${Math.max(1, Math.round(x * 24))} 小时`, "bad"];
  return [`剩 ${Math.floor(x)} 天`, x < 2 ? "warn" : "ok"];
}

function renderMine() {
  const soon = S.installs.filter(i => i.days_left < 2).length;
  const b = $("minebadge"); b.style.display = soon ? "" : "none"; b.textContent = soon;
  if (S.tab !== "mine") return;
  const m = S.pilotMsg;
  const rows = S.installs.map(i => {
    const [dt, dc] = fmtDays(i.days_left);
    const upd = i.latest && i.version && i.latest !== i.version ? ` · <span style="color:var(--accent)">有新版 v${esc(i.latest)}</span>` : "";
    return `<div class="inst">
      <div><h4>${esc(i.name)} <span class="m">v${esc(i.version)}${upd}</span></h4>
        <div class="m">${esc(i.device)} · ${new Date(i.expires_at * 1000).toLocaleString("zh-CN", {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"})} 到期${i.running ? " · <span style='color:#ff9f0a'>正在续签…</span>" : ""}</div></div>
      <div class="days ${dc}">${dt}</div>
      <div style="display:flex;align-items:center;gap:8px" title="自动续签和更新"><span class="m">自动</span><span class="sw sm ${i.auto ? "on" : ""}" onclick="api().set_auto('${i.key}', ${!i.auto})"></span>
        <span class="link" style="font-size:12px;color:var(--dim)" onclick="if(confirm('不再管理这个 App？（不会从手机上删除）')) api().forget_install('${i.key}')">移除</span></div>
      ${i.error ? `<div class="err">上次没成功：${esc(i.error)}</div>` : ""}
    </div>`;
  }).join("");
  $("mineview").innerHTML = `
    <div class="pilotbar">
      <div class="t"><h3>自动续签 + 自动更新</h3>
        <p>免费 Apple ID 签的 App 只能用 7 天。打开这个开关后，只要电脑开着、手机连着数据线<b>或者和电脑在同一个 Wi‑Fi</b>，到期前 2 天会自动重新签名，有新版本也会自动装上，App 里的数据不会丢。</p>
        ${m ? `<div class="pilotmsg ${m.state}">${esc(m.text)}</div>` : ""}</div>
      <button class="smallbtn" onclick="doRefresh()">检查更新</button>
      <button class="smallbtn" onclick="api().renew_now()">立即全部续签</button>
      <span class="sw ${S.pilotOn ? "on" : ""}" onclick="api().set_autopilot(${!S.pilotOn})"></span>
    </div>
    ${rows || '<div class="empty" style="margin-top:80px;text-align:center;color:var(--sub)">还没有装过 App。<br>去「装 App」装一个，就会出现在这里。</div>'}
    <div class="m" style="color:var(--dim);font-size:12px;margin-top:10px;line-height:1.6">
      💡 想用 Wi‑Fi 自动续签：先用数据线连一次，在 Mac 的「访达」或 Windows 的「Apple 设备」里勾选「通过 Wi‑Fi 显示此 iPhone」。之后手机和电脑在同一个 Wi‑Fi 下，就不用插线了。<br>
      </div>
    <div class="pilotbar" style="margin-top:12px">
      <div class="t"><h3>开机自动启动</h3><p>电脑开机后「一键装」自动在后台最小化运行，不用每次手动打开，续签和更新不会漏。</p></div>
      <span class="sw ${S.autostart ? "on" : ""}" onclick="api().set_autostart(${!S.autostart}).then(v => { S.autostart = v; renderMine(); })"></span>
    </div>`;
}

function removeCustom(id) {
  if (S.busy) return;
  if (!confirm("从列表移除这个 IPA？（不影响手机上已装好的 App）")) return;
  S.sel = null; api().remove_custom(id);
}

function select(id) { if (S.busy) return; S.sel = id; renderList(); renderDetail(); }

function renderDetail() {
  const a = allApps().find(x => x.id === S.sel); if (!a) return;
  const size = a.size ? ` · ${(a.size/1048576).toFixed(1)} MB` : "";
  const ver = a.version ? `v${esc(a.version)}` : (a.has_asset === false ? "暂无安装包" : "读取版本…");
  const minos = a.min_ios ? ` · 需要 iOS ${esc(a.min_ios)}+` : "";
  $("detail").innerHTML = `
    <div class="head">${iconHTML(a, true)}
      <div><h2>${esc(a.name)}${a.custom ? '<span class="tag">本地 IPA</span>' : ""}</h2><div class="meta">${ver}${size}${minos}</div>
      ${a.homepage ? `<span class="link" onclick="api().open_url('${esc(a.homepage)}')">项目主页</span>` : ""}</div></div>
    <div class="desc">${a.custom ? "包名 " + esc(a.bundle_id) + "<br>免费 Apple ID 签名后包名会加上你的团队后缀，跟原版 App 并存。" : esc(a.description)}</div>
    <ul class="steps">${STEPS.map(([k,t]) => `<li id="st-${k}"><span class="dot"></span><span>${t}</span><span class="note"></span></li>`).join("")}</ul>
    <div class="bar"><i></i></div>
    <div class="msg" id="msg"></div>
    <div class="actions">${a.custom ? `<button class="ghostbtn" onclick="removeCustom('${a.id}')">从列表移除</button>` : ""}<button class="go" id="go" onclick="go()" ${a.has_asset === false ? "disabled" : ""}>${a.has_asset === false ? "暂无安装包" : "一键安装"}</button></div>`;
  if (S.dev) setStep("device", "ok", S.dev.name);
}

function setStep(k, state, note) {
  const li = $("st-" + k); if (!li) return;
  li.className = state === "run" ? "on" : state;
  if (note !== undefined) li.querySelector(".note").textContent = note || "";
  if (state !== "run") { const b = document.querySelector(".bar"); if (b) b.style.display = "none"; }
}
function msg(t, cls) { const m = $("msg"); if (m) { m.textContent = t; m.className = "msg " + (cls || ""); } }

function go() {
  if (!S.dev) { setStep("device", "err", "没找到手机"); msg("① 用数据线把 iPhone 连到这台电脑\n② 解锁手机，弹出「要信任此电脑吗？」点「信任」，输入锁屏密码\n连上后底部会显示手机名字，再点一键安装。", "err"); return; }
  S.busy = true; renderDetail();
  $("go").disabled = true; $("go").textContent = "安装中…";
  api().install(S.sel, S.dev.udid);
}

function finish(ok, err) {
  S.busy = false;
  const g = $("go"); if (g) { g.disabled = false; g.textContent = "再装一次"; }
  if (ok) {
    setStep("trust", "on");
    msg("✅ 已装到手机！第一次打开前，在手机上：\n① 设置 → 通用 → VPN 与设备管理 → 点你的 Apple ID → 信任\n② 如果提示需要开发者模式：设置 → 隐私与安全性 → 开发者模式 → 打开，按提示重启\n免费 Apple ID 签的 App 7 天后会过期，到时打开本软件再装一次即可（数据不丢）。", "ok");
  } else msg("没装上：" + err, "err");
}

function loginDone(ok) {
  $("loginMask").classList.remove("show");
  api().submit_login(ok ? $("user").value.trim() : "", ok ? $("pw").value : "");
  $("pw").value = "";
}
function codeDone(ok) { $("codeMask").classList.remove("show"); api().submit_2fa(ok ? $("code").value.trim() : ""); }
$("pw").addEventListener("keydown", e => e.key === "Enter" && loginDone(true));
$("code").addEventListener("keydown", e => e.key === "Enter" && codeDone(true));
$("code").addEventListener("input", e => e.target.value.length === 6 && codeDone(true));

async function doLogout() {
  if (S.busy) return;
  if (!confirm("退出这个 Apple ID？下次安装需要重新登录。")) return;
  await api().logout(); $("acct").textContent = "";
}

async function pollDevices() {
  try {
    const list = await api().devices();
    S.devices = list;
    if (!S.dev || !list.find(d => d.udid === S.dev.udid)) S.dev = list[0] || null;
    const sel = $("devsel");
    if (list.length > 1) {
      sel.style.display = "";
      sel.innerHTML = list.map(d => `<option value="${d.udid}" ${S.dev && d.udid === S.dev.udid ? "selected" : ""}>${esc(d.name)}（${d.via === "USB" ? "数据线" : "Wi‑Fi"}）</option>`).join("");
      sel.onchange = () => { S.dev = list.find(d => d.udid === sel.value); if (!S.busy) renderDetail(); };
    } else sel.style.display = "none";
    $("devdot").className = "d" + (S.dev ? " on" : "");
    $("devtext").textContent = S.dev ? (list.length > 1 ? "安装到：" : `已连接：${S.dev.name}（${S.dev.via === "USB" ? "数据线" : "Wi‑Fi"}）`)
                                     : "未连接手机：用数据线把 iPhone 连到这台电脑，解锁后点「信任」";
    if (S.sel && !S.busy) setStep("device", S.dev ? "ok" : "", S.dev ? S.dev.name : "");
    const acc = await api().accounts();
    $("acct").innerHTML = acc.length ? `Apple ID：${esc(acc[0])} <span class="link" style="margin-left:6px" onclick="doLogout()">退出</span>` : "";
  } catch (e) {}
  setTimeout(pollDevices, 2500);
}

let dragDepth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; if (!S.busy) $("drop").classList.add("show"); });
window.addEventListener("dragleave", e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; $("drop").classList.remove("show"); } });
window.addEventListener("dragover", e => e.preventDefault());
// 真正的「拿路径」在 Python 那边（pywebview DOM 事件才带完整路径），这里只收起遮罩
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("drop").classList.remove("show"); });

let lastFocusRefresh = Date.now();
window.addEventListener("focus", () => { if (Date.now() - lastFocusRefresh > 10 * 60 * 1000 && !S.busy) { lastFocusRefresh = Date.now(); doRefresh(); } });

window.addEventListener("pywebviewready", async () => {
  api().load(); pollDevices();
  api().installs().then(d => { S.installs = d.items; S.pilotOn = d.enabled; renderMine(); });
  api().autostart().then(v => { S.autostart = v; renderMine(); });
  // 自检用：环境变量 ONETAP_AUTOINSTALL=<appid> 时，列表和手机就绪后自动点一键安装
  const auto = await api().auto_install();
  if (auto) {
    const t = setInterval(() => {
      const a = allApps().find(x => x.id === auto);
      if (a && a.version && S.dev) { clearInterval(t); select(auto); go(); }
    }, 1000);
  }
});
</script>
</body>
</html>
